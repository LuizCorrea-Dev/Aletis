services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Banco de Dados Relacional e Vetorial 100% Local (PostgreSQL + pgvector)
  # ─────────────────────────────────────────────────────────────────────────────
  aletis_db:
    image: pgvector/pgvector:pg16
    container_name: aletis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aletis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletis_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aletis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-local-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aletis} -d ${POSTGRES_DB:-aletis_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Motor de IA Local Dual-Brain (Ollama - Off & Local, Sem API Key)
  # ─────────────────────────────────────────────────────────────────────────────
  aletis_ollama:
    image: ollama/ollama:latest
    container_name: aletis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. Inicializador dos 2 Cérebros (Llama + DeepSeek) + Embeddings pgvector
  # ─────────────────────────────────────────────────────────────────────────────
  aletis_ollama_pull:
    image: curlimages/curl:latest
    container_name: aletis-ollama-pull
    depends_on:
      - aletis_ollama
    command: >
      sh -c "
        echo 'Aguardando motor Ollama iniciar no Docker...' &&
        sleep 5 &&
        echo '1/3: Baixando Cérebro 1 (DeepSeek-R1) localmente...' &&
        curl -s http://aletis_ollama:11434/api/pull -d '{\"name\": \"deepseek-r1:1.5b\"}' &&
        echo '2/3: Baixando Cérebro 2 (Llama 3.2) localmente...' &&
        curl -s http://aletis_ollama:11434/api/pull -d '{\"name\": \"llama3.2\"}' &&
        echo '3/3: Baixando modelo de Embeddings (nomic-embed-text) para pgvector...' &&
        curl -s http://aletis_ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}' &&
        echo 'Cérebros Llama + DeepSeek + Embeddings instalados com sucesso no Docker!'
      "
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Frontend / Backend Next.js Standalone (Desacoplado de Vercel/Supabase)
  # ─────────────────────────────────────────────────────────────────────────────
  aletis_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletis-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      # Conexão com o banco relacional + pgvector local
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aletis}:${POSTGRES_PASSWORD:-aletis_secret_pass}@aletis_db:5432/${POSTGRES_DB:-aletis_db}
      # Conexão com os 2 Cérebros da IA Sentinela local
      - OLLAMA_BASE_URL=http://aletis_ollama:11434
      - OLLAMA_BRAIN_REASONING_MODEL=deepseek-r1:1.5b
      - OLLAMA_BRAIN_MENTOR_MODEL=llama3.2
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # LiveKit SFU (Voz, Vídeo & Compartilhamento de Tela)
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-http://localhost:7880}
    depends_on:
      aletis_db:
        condition: service_healthy
      aletis_ollama:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Servidor de Mídia SFU para Chamadas em Grupo (LiveKit WebRTC 100% Local)
  # ─────────────────────────────────────────────────────────────────────────────
  aletis_livekit:
    image: livekit/livekit-server:latest
    container_name: aletis-livekit
    restart: unless-stopped
    command: '--dev --keys "devkey: secretsecretsecretsecretsecretsecret"'
    ports:
      - "7880:7880"     # Sinalização HTTP/WebSocket
      - "7881:7881"     # WebRTC TCP
      - "7882:7882/udp" # WebRTC UDP
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  ollama_data:


services:
  # Servidor de Mídia SFU (Multiplexado)
  livekit:
    image: livekit/livekit-server:latest
    container_name: aletis-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_RTC_NODE_IP=${VPS_PUBLIC_IP:-127.0.0.1}
    ports:
      - "7880:7880"     # Sinalização HTTP/WS
      - "7882:7882/udp" # WebRTC Multiplexado (Sem range dinâmico)
    cpuset: "0,1"       # Blindagem física de núcleos para rede UDP
    networks:
      - aletis-net

  # Banco de Dados Relacional & Vetorial (pgvector)
  postgres:
    image: postgres:16-alpine
    container_name: aletis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aletis}
      POSTGRES_USER: ${POSTGRES_USER:-aletis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletis_secret_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpuset: "2,3"
    mem_limit: 2g
    networks:
      - aletis-net

  # Inteligência Artificial Local (Ollama - Sentinela)
  ollama:
    image: ollama/ollama:latest
    container_name: aletis-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OMP_NUM_THREADS=4 # Linhas de execução de cálculo matricial limitadas aos núcleos
    cpuset: "4-7"         # Confinado na metade superior, sem interferir no tempo real
    cpus: "4.0"
    mem_limit: 8g
    networks:
      - aletis-net

  # Aplicação Next.js (Web & API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletis-web
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aletis}:${POSTGRES_PASSWORD:-aletis_secret_pass}@postgres:5432/${POSTGRES_DB:-aletis}
      - OLLAMA_HOST=http://ollama:11434
      - LIVEKIT_API_KEY=API_KEY_ALETIS
      - LIVEKIT_API_SECRET=SUA_API_SECRET_LONGA_E_SEGURA
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - NEXT_PUBLIC_LIVEKIT_WS_URL=ws://${APP_DOMAIN:-localhost}:7880
    ports:
      - "3000:3000"
    cpuset: "2,3"
    mem_limit: 2g
    depends_on:
      - livekit
      - postgres
    networks:
      - aletis-net

networks:
  aletis-net:
    driver: bridge

volumes:
  pgdata:
  ollama_models:
